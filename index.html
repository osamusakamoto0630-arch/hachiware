<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ハチワレAR</title>
    <script src="https://cdn.jsdelivr.net/npm/tracking@1.9.0/build/tracking-min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; position: fixed; width: 100%; height: 100%; font-family: sans-serif; }
        video { width: 100vw; height: 100vh; object-fit: cover; }
        .hachiware { position: absolute; display: none; pointer-events: none; z-index: 10; }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; color: white;
        }
        button {
            padding: 20px 40px; font-size: 20px; cursor: pointer;
            border-radius: 50px; border: none; background: #febd31; color: #333; font-weight: bold;
            box-shadow: 0 4px 15px rgba(255,189,49,0.4);
        }
    </style>
</head>
<body>

    <div id="overlay">
        <button id="start-btn">ハチワレを呼ぶ（カメラ起動）</button>
    </div>

    <video id="video" playsinline webkit-playsinline autoplay muted></video>
    <img id="display-hachi" class="hachiware" src="">

    <script>
        const video = document.getElementById('video');
        const displayHachi = document.getElementById('display-hachi');
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('overlay');
        const hachiList = ['hachi1.png', 'hachi2.png', 'hachi3.png', 'hachi4.png'];

        // トラッカー設定
        const tracker = new tracking.ColorTracker(['yellow', 'cyan', 'magenta']);
        tracking.ColorTracker.registerColor('red', (r, g, b) => (r > 160 && g < 80 && b < 80));
        tracker.setColors(['red', 'yellow', 'cyan', 'magenta']);

        let isFound = false;

        tracker.on('track', (event) => {
            if (event.data.length === 0) {
                displayHachi.style.display = 'none';
                isFound = false;
            } else {
                const rect = event.data[0];
                if (!isFound) {
                    displayHachi.src = hachiList[Math.floor(Math.random() * hachiList.length)];
                    isFound = true;
                }
                displayHachi.style.display = 'block';
                displayHachi.style.left = rect.x + 'px';
                displayHachi.style.top = rect.y + 'px';
                displayHachi.style.width = rect.width + 'px';
            }
        });

        startBtn.addEventListener('click', async () => {
            try {
                // iPhoneの省電力モード等でも動きやすくする設定
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" },
                    audio: false
                });
                
                video.srcObject = stream;
                // iPhone Safariでは一度 play() を明示的に呼ぶ必要がある
                await video.play();
                
                overlay.style.display = 'none';
                tracking.track('#video', tracker);
                
            } catch (err) {
                alert("iPhoneの設定でカメラを許可してください。エラー: " + err);
            }
        });
    </script>
</body>
</html>
