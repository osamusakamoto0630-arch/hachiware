<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ハチワレAR - 起動テスト版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tracking.js/1.1.3/tracking-min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        video { width: 100vw; height: 100vh; object-fit: cover; }
        .hachiware { position: absolute; display: none; pointer-events: none; z-index: 10; }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; color: white;
        }
        button {
            padding: 15px 30px; font-size: 18px; cursor: pointer;
            border-radius: 10px; border: none; background: #febd31; color: #333; font-weight: bold;
        }
        #error-log { position: fixed; bottom: 10px; left: 10px; color: red; font-size: 12px; z-index: 200; background: rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div id="overlay">
        <h2>ハチワレAR</h2>
        <button id="start-btn">カメラを起動する</button>
        <p style="margin-top:15px; font-size:12px;">※カメラの許可が必要です</p>
    </div>

    <div id="error-log"></div>

    <video id="video" playsinline webkit-playsinline autoplay loop muted></video>
    <img id="display-hachi" class="hachiware" src="">

    <script>
        const video = document.getElementById('video');
        const displayHachi = document.getElementById('display-hachi');
        const errorLog = document.getElementById('error-log');
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('overlay');
        const hachiList = ['hachi1.png', 'hachi2.png', 'hachi3.png', 'hachi4.png'];

        // エラー表示用関数
        function logError(msg) {
            errorLog.innerHTML += msg + "<br>";
            console.error(msg);
        }

        // トラッカー設定
        const tracker = new tracking.ColorTracker(['yellow', 'cyan', 'magenta']);
        tracking.ColorTracker.registerColor('red', (r, g, b) => (r > 160 && g < 80 && b < 80));
        tracker.setColors(['red', 'yellow', 'cyan', 'magenta']);

        let isFound = false;
        tracker.on('track', function(event) {
            if (event.data.length === 0) {
                displayHachi.style.display = 'none';
                isFound = false;
            } else {
                const rect = event.data[0];
                if (!isFound) {
                    displayHachi.src = hachiList[Math.floor(Math.random() * hachiList.length)];
                    isFound = true;
                }
                displayHachi.style.display = 'block';
                displayHachi.style.left = rect.x + 'px';
                displayHachi.style.top = rect.y + 'px';
                displayHachi.style.width = rect.width + 'px';
            }
        });

        // ボタンを押した時にカメラを起動
        startBtn.addEventListener('click', function() {
            overlay.style.display = 'none'; // オーバーレイを消す
            
            const constraints = {
                video: { facingMode: "environment" }, // 外カメラ
                audio: false
            };

            navigator.mediaDevices.getUserMedia(constraints)
                .then((stream) => {
                    video.srcObject = stream;
                    video.onloadedmetadata = () => {
                        video.play();
                        tracking.track('#video', tracker);
                    };
                })
                .catch((err) => {
                    logError("カメラ起動エラー: " + err.name + " - " + err.message);
                    if (err.name === 'NotAllowedError') {
                        alert("カメラの権限が拒否されています。ブラウザの設定を確認してください。");
                    }
                });
        });
    </script>
</body>
</html>
