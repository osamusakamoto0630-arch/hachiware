<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ハチワレAR</title>
    <script src="https://cdn.jsdelivr.net/npm/tracking@1.9.0/build/tracking-min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; position: fixed; width: 100%; height: 100%; }
        video { width: 100vw; height: 100vh; object-fit: cover; }
        .hachiware { position: absolute; display: none; pointer-events: none; z-index: 10; }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; color: white;
        }
        button {
            padding: 15px 30px; font-size: 18px; cursor: pointer;
            border-radius: 10px; border: none; background: #febd31; color: #333; font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h2>ハチワレAR</h2>
        <button id="start-btn">カメラを起動する</button>
        <p style="margin-top:15px; font-size:12px;">※明るい場所で試してね</p>
    </div>

    <video id="video" playsinline webkit-playsinline autoplay loop muted></video>
    <img id="display-hachi" class="hachiware" src="">

    <script>
        const video = document.getElementById('video');
        const displayHachi = document.getElementById('display-hachi');
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('overlay');
        const hachiList = ['hachi1.png', 'hachi2.png', 'hachi3.png', 'hachi4.png'];

        // トラッカー設定
        const tracker = new tracking.ColorTracker(['yellow', 'cyan', 'magenta']);
        
        // 赤色判定を自作
        tracking.ColorTracker.registerColor('red', function(r, g, b) {
          if (r > 160 && g < 80 && b < 80) return true;
          return false;
        });
        tracker.setColors(['red', 'yellow', 'cyan', 'magenta']);

        let isFound = false;

        tracker.on('track', function(event) {
            if (event.data.length === 0) {
                displayHachi.style.display = 'none';
                isFound = false;
            } else {
                const rect = event.data[0];
                if (!isFound) {
                    displayHachi.src = hachiList[Math.floor(Math.random() * hachiList.length)];
                    isFound = true;
                }
                displayHachi.style.display = 'block';
                // 画面サイズに合わせて位置を調整
                displayHachi.style.left = rect.x + 'px';
                displayHachi.style.top = rect.y + 'px';
                displayHachi.style.width = rect.width + 'px';
            }
        });

        startBtn.addEventListener('click', function() {
            overlay.style.display = 'none';
            
            const constraints = {
                video: { facingMode: "environment" },
                audio: false
            };

            navigator.mediaDevices.getUserMedia(constraints)
                .then((stream) => {
                    video.srcObject = stream;
                    video.onloadedmetadata = () => {
                        video.play();
                        // 少し遅らせてトラッキング開始（安定させるため）
                        setTimeout(() => {
                            tracking.track('#video', tracker);
                        }, 500);
                    };
                })
                .catch((err) => {
                    alert("カメラの起動に失敗しました。設定を確認してください: " + err);
                });
        });
    </script>
</body>
</html>
